name: codesmith

services:
  codesmith-cli:
    build: .
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-(your_openrouter_api_key_here)}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    volumes:
      - .:/work
      - ./workspace:/workspace
    working_dir: /work
    stdin_open: true
    tty: true
